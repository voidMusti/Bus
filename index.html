
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>mustiBus</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- mustiBus demo project - fictional recreation -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #eef5ff;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 15px;
      padding-bottom: 15px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .ticket {
      width: 100%;
      max-width: 370px;
      background: #fdfdfd;
      margin: 0 12px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.17),
        0 2px 4px rgba(0, 0, 0, 0.10);
      position: relative;
      transform: translateY(0px);
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .top-strip {
      background: #fafafa;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      padding: 10px 12px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .top-strip .close {
      font-size: 17px;
      font-weight: 349;
      letter-spacing: 0.3px;
      color: #000;
      line-height: 1;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      transform: translateX(2px);
    }

    .header {
      background: #a30b23;
      padding: 10px 4px;
      text-align: center;
      font-weight: normal;
      font-size: 16px;
      letter-spacing: 0.4px;
      color: white;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      position: relative;
      top: 8px;
      z-index: 2;
    }

    .qr-container {
      background: white;
      padding: 16px;
      margin: 10px auto;
      width: 220px;
      height: 220px;
      border-radius: 16px;
    }

    #qrcode {
      width: 100% !important;
      height: 100% !important;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode canvas {
      display: block;
    }

    #qrcode::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: black;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 4px white,
        0 0 0 8px black,
        0 0 0 12px white,
        0 0 0 16px black,
        0 0 0 20px white,
        0 0 0 24px black;
    }

    .text {
      font-size: 15px;
      line-height: 1.2;
      margin: 0 16px 10px;
      text-align: center;
      color: #7a7a7a;
      font-weight: 580;
      letter-spacing: 0.04px;
    }

    .expiry-container {
      position: relative;
      height: 48px;
      margin: 0 14px;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
    }

    .expiry-strip {
      position: absolute;
      inset: 0;
      display: flex;
    }

    .strip {
      flex: 1;
    }

    .expiry-time {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      font-weight: 500;
      z-index: 2;
      text-shadow:
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000,
        0 0 3px rgba(0, 0, 0, 0.9),
        4px 4px 8px rgba(0, 0, 0, 1);
      white-space: nowrap;
      animation: sway 2.8s infinite ease-in-out;
    }

    @keyframes sway {
      0%   { transform: translateX(-50px); }
      50%  { transform: translateX(50px); }
      100% { transform: translateX(-50px); }
    }

    .verified {
      background: #ffe74c;
      color: black;
      font-weight: 600;
      font-size: 18px;
      text-align: center;
      padding: 6px 0;
      margin: 0 14px;
      border-radius: 0;
    }

    .logo-area {
      padding: 18px 20px 16px;
      text-align: center;
      background: #5A3B63;
      margin: 0 14px;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .logo-n {
      width: 90px;
      height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: 0 0 12px 12px;
      background: rgba(255, 255, 255, 0.7);
      clip-path: polygon(
        25% 0%, 75% 0%, 100% 50%,
        75% 100%, 25% 100%, 0% 50%
      );
    }

    .logo-n::after {
      content: "";
      position: absolute;
      inset: 6px;
      background: #5A3B63;
      clip-path: polygon(
        25% 0%, 75% 0%, 100% 50%,
        75% 100%, 25% 100%, 0% 50%
      );
      z-index: 1;
    }

    .logo-n span {
      position: relative;
      font-size: 70px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -2px;
      color: rgba(255, 255, 255, 0.7);
      z-index: 2;
      line-height: 1;
      display: block;
      margin-top: -10px;
      transform: scaleY(0.9);
    }

    .cashback {
      background: #017FAF;
      color: white;
      padding: 15px 0;
      font-weight: 370;
      text-align: center;
      font-size: 18px;
      margin: 8px 14px 60px;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 16px;
      align-items: center;
      font-size: 15px;
      color: #017FAF;
      border-top: 1px dashed #444;
      margin-top: -4px;
      border-bottom-left-radius: 3px;
      border-bottom-right-radius: 3px;
    }
  </style>
</head>

<body>
  <div class="ticket">
    <div class="top-strip">
      <div class="close" onclick="window.location.replace('home.html')">Close</div>
    </div>

    <div class="header">
      nBus - 1618 - Direct Issue nBus - 1618
    </div>

    <div class="qr-container">
      <div id="qrcode"></div>
    </div>

    <div class="text">
      Unlimited travel on all National Express buses and any other bus operator
      that is part of the nBus scheme within the West Midlands nBus zone
    </div>

    <div class="expiry-container">
      <div class="expiry-strip">
        <div class="strip"></div>
        <div class="strip"></div>
        <div class="strip"></div>
      </div>
      <div class="expiry-time" id="expiry-time"></div>
    </div>

    <div class="verified">16-18 Verified ✓</div>

    <div class="logo-area">
      <div class="logo-n">
        <span>n</span>
      </div>
    </div>

    <div class="cashback">NX Rewards Cashback</div>

    <div class="footer-bar">
      <span>… Actions</span>
      <span>≣ Details</span>
    </div>
  </div>

  <script>
    function generateQRCode() {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      new QRCode(qrContainer, {
        text: "nBus-1618-DirectIssue-nBus-1618-" + Date.now(),
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    generateQRCode();
    setInterval(generateQRCode, 2900);

    // Shared hourly colour generator.
    // This must remain identical to the version in home.html.

    function getSharedHourlyStripColours() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      const part = type => parts.find(item => item.type === type).value;

      const year = Number(part("year"));
      const month = Number(part("month"));
      const day = Number(part("day"));
      const hour = Number(part("hour"));

      const hourNumber = Math.floor(
        Date.UTC(year, month - 1, day, hour) / 3600000
      );

      let seed = (hourNumber ^ 0x6D2B79F5) >>> 0;

      function random() {
        seed = (seed + 0x6D2B79F5) >>> 0;

        let value = seed;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);

        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      }

      function between(min, max) {
        return min + Math.floor(random() * (max - min + 1));
      }

      const families = [
        { name: "grey",       h: [205, 220], s: [8, 22],   l: [48, 78] },
        { name: "icyBlue",    h: [188, 205], s: [45, 78],  l: [72, 89] },
        { name: "blue",       h: [205, 225], s: [55, 88],  l: [38, 68] },
        { name: "purple",     h: [258, 282], s: [48, 85],  l: [38, 72] },
        { name: "magenta",    h: [310, 330], s: [58, 92],  l: [42, 72] },
        { name: "pink",       h: [332, 350], s: [48, 88],  l: [58, 84] },
        { name: "red",        h: [0, 9],     s: [58, 90],  l: [38, 65] },
        { name: "orange",     h: [18, 35],   s: [62, 94],  l: [44, 70] },
        { name: "yellow",     h: [43, 57],   s: [55, 92],  l: [67, 88] },
        { name: "green",      h: [105, 140], s: [38, 78],  l: [32, 70] },
        { name: "teal",       h: [165, 185], s: [42, 82],  l: [36, 70] }
      ];

      function makeColour(family, lightnessOverride) {
        const hue = between(family.h[0], family.h[1]);
        const saturation = between(family.s[0], family.s[1]);
        const lightness = lightnessOverride === undefined
          ? between(family.l[0], family.l[1])
          : lightnessOverride;

        return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
      }

      const useRelatedColours = random() < 0.24;

      if (useRelatedColours) {
        const schemes = [
          ["green", "green", "yellow"],
          ["blue", "blue", "icyBlue"],
          ["purple", "purple", "icyBlue"],
          ["magenta", "pink", "purple"],
          ["red", "pink", "orange"],
          ["teal", "green", "icyBlue"],
          ["orange", "yellow", "red"],
          ["grey", "icyBlue", "blue"],
          ["grey", "grey", "icyBlue"],
          ["green", "teal", "yellow"],
          ["pink", "magenta", "icyBlue"]
        ];

        const scheme = schemes[between(0, schemes.length - 1)];

        return scheme.map((name, index) => {
          const family = families.find(item => item.name === name);

          const lightness = [
            between(30, 48),
            between(46, 68),
            between(69, 88)
          ][index];

          return makeColour(family, lightness);
        });
      }

      const chosen = [];

      while (chosen.length < 3) {
        const family = families[between(0, families.length - 1)];

        if (!chosen.some(item => item.name === family.name)) {
          chosen.push(family);
        }
      }

      for (let i = chosen.length - 1; i > 0; i--) {
        const j = between(0, i);
        [chosen[i], chosen[j]] = [chosen[j], chosen[i]];
      }

      return chosen.map(family => makeColour(family));
    }

    function updateStripColours() {
      const colours = getSharedHourlyStripColours();

      document.querySelectorAll(".expiry-strip .strip")
        .forEach((strip, index) => {
          strip.style.backgroundColor = colours[index];
        });
    }

    updateStripColours();
    setInterval(updateStripColours, 1000);
    window.addEventListener("pageshow", updateStripColours);

    function updateExpiry() {
      const now = new Date();

      const timeStr = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(now);

      const dateStr = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(now);

      document.getElementById("expiry-time").textContent =
        `${timeStr} ${dateStr}`;
    }

    updateExpiry();
    setInterval(updateExpiry, 1000);
  </script>

  <div style="
    position: fixed;
    bottom: 3px;
    left: 10px;
    font-size: 9px;
    color: #999;
    opacity: 0.6;
    user-select: none;
  ">
    UI Demo project
  </div>
</body>
</html>
