
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>mTickets - Wallet</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #eef5ff;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 8px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #363636;
      background: #eef5ff;
    }

    /* HEADER */
    .header {
      height: 14vh;
      min-height: 95px;
      max-height: 145px;
      flex-shrink: 0;
      padding: 0 26px 22px;
      display: flex;
      align-items: flex-end;
      position: relative;
      color: white;
      background: linear-gradient(
        135deg,
        #ed0030 0%,
        #ed0030 52%,
        #55585c 52%,
        #55585c 100%
      );
    }

    .header h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 800;
      line-height: 1;
    }

    .profile {
      position: absolute;
      right: 16px;
      bottom: 22px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: white;
      color: #363636;
    }

    .profile svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    /* ACCOUNT BALANCE */
    .account-balance {
      flex-shrink: 0;
      margin: 16px 16px 6px;
      padding: 22px 24px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .balance-label {
      margin: 0 0 10px;
      color: #363636;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }

    .balance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .balance-amount {
      color: #363636;
      font-size: clamp(30px, 8.5vw, 37px);
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
    }

    .add-funds-button {
      flex-shrink: 0;
      min-width: 120px;
      padding: 11px 15px;
      border: 2px solid #ed0030;
      border-radius: 999px;
      background: #ffffff;
      color: #363636;
      font-family: inherit;
      font-size: 14px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .add-funds-button:active {
      background: #fff5f6;
    }

    /* TABS */
    .tabs {
      flex-shrink: 0;
      height: 10vh;
      min-height: 65px;
      max-height: 90px;
      display: flex;
      align-items: stretch;
      margin: 0 22px;
      padding: 0;
      border: none;
    }

    .tabs-inner {
      display: flex;
      width: 100%;
      min-width: 0;
    }

    .tab {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 5px;
      font-family: inherit;
      font-size: clamp(11px, 3.2vw, 15px);
      font-weight: 700;
      white-space: nowrap;
      color: #363636;
      background: transparent;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .tab::after {
      content: "";
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      height: 1px;
      background: transparent;
    }

    .tab.active::after {
      background: #111;
    }

    .tab-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: block;
    }

    .tab-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* TICKET BOX */
    .ticket-panel {
      flex: 0 0 auto;
      min-height: 0;
      overflow: visible;
      margin: 8px 16px 0;
      padding: 0;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
    }

    .ticket-panel[hidden] {
      display: none;
    }

    .ticket-card {
      display: block;
      width: 100%;
      padding: 16px;
      color: inherit;
      text-decoration: none;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 11px;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.12);
      transition: background-color 0.12s ease;
    }

    .ticket-card:active {
      background: #f7f7f7;
    }

    .ticket-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ticket-card h2 {
      margin: 0 0 7px;
      font-size: clamp(16px, 4.5vw, 19px);
      font-weight: 750;
      line-height: 1.3;
    }

    .ticket-card p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.4;
    }

    .active-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      border-radius: 6px;
      background: #e8f5e9;
      color: #28783a;
      font-size: 11px;
      font-weight: 750;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #2e9b49;
    }

    /* DIVIDER AT THE EDGE OF THE EXPIRY SECTION */
    .ticket-divider {
      display: block;
      height: 1px;
      margin: 14px 0 16px;
      background: transparent;
    }

    .expiry-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12px;
      line-height: 1.4;
    }

    .clock-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: block;
      fill: none;
      stroke: #777;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .expiry-label {
      color: #777;
    }

    .expiry-date {
      color: #363636;
      font-weight: 650;
    }

    /* CURRENT TICKETS AREA */
    #currentTickets {
      display: contents;
    }

    #currentTickets[hidden] {
      display: none;
    }

    
.refresh-wallet {
  flex-shrink: 0;
  align-self: stretch;
  width: auto;
  margin: 8px 32px 0px;
  padding: 4px 0 0;
  border: none;
  border-radius: 0;
  background: transparent;
  color: #000;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

.refresh-question {
  display: block;
  margin-bottom: 5px;
  color: #777;
  font-size: 14px;
  line-height: 1.3;
  transform: translateY(5px);
}

.refresh-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  padding: 10px 15px;
  border: 2px solid #ed0030;
  border-radius: 999px;
  background: #eef5ff;
  color: #363636;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.2;
  transform: translateY(25px);
}

.refresh-wallet:active {
  background: transparent;
}

.refresh-action:active {
  background: #e4edfa;
}


    /* CENTRED TICKET HISTORY MESSAGE */
    #ticketHistory {
      flex: 1;
      width: 100%;
      min-height: 150px;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #ticketHistory[hidden] {
      display: none;
    }

    .description {
      margin: 0;
      color: #7c7f84;
      font-size: clamp(14px, 4vw, 19px);
      line-height: 1.5;
      text-align: center;
    }

    .buy-button {
      flex-shrink: 0;
      margin: auto 16px 14px;
      padding: 9px 6px;
      border-radius: 50px;
      background: #ed0030;
      color: white;
      text-align: center;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 500;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* BOTTOM NAVIGATION */
    .bottom-nav {
      flex-shrink: 0;
      min-height: 68px;
      padding: 6px 4px max(6px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: white;
      border-top: 1px solid #d8dfe8;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px;
      font-weight: 500;
      font-size: 11.5px;
    }

    .nav-icon {
      width: 25px;
      height: 25px;
      display: block;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-height: 700px) {
      .header {
        min-height: 85px;
        padding-bottom: 15px;
      }

      .profile {
        bottom: 16px;
        width: 42px;
        height: 42px;
      }

      .account-balance {
        min-height: 132px;
        margin-top: 12px;
        padding: 18px 20px;
      }

      .balance-amount {
        font-size: clamp(30px, 8vw, 36px);
      }

      .add-funds-button {
        padding: 11px 15px;
      }

      .tabs {
        min-height: 55px;
      }

      .ticket-panel {
        margin-top: 6px;
      }

      .ticket-card {
        padding: 12px;
      }

      .ticket-divider {
        margin: 12px -12px 10px;
      }

      .refresh-wallet {
        margin-top: 12px;
        padding: 8px 10px;
      }

      .refresh-question {
        font-size: 15px;
      }

      .refresh-action {
        padding: 10px 20px;
      }

      .buy-button {
        margin-bottom: 6px;
        padding: 10px 6px;
      }

      .bottom-nav {
        min-height: 60px;
      }

      .nav-icon {
        width: 23px;
        height: 23px;
      }
    }

    @media (max-width: 360px) {
      .account-balance {
        padding: 22px 18px;
      }

      .balance-row {
        gap: 6px;
      }

      .balance-amount {
        font-size: 30px;
      }

      .add-funds-button {
        padding: 11px 12px;
        min-width: 0;
        font-size: 14px;
      }

      .refresh-action {
        min-width: 180px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <h1>mTickets</h1>

    <div class="profile" aria-label="Profile">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="15" r="7"
          stroke="currentColor" stroke-width="3.2" fill="none"/>
        <path d="M7 39 C7 29, 15 27, 24 27 C33 27, 41 29, 41 39"
          stroke="currentColor" stroke-width="3.2"
          stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </header>

  <!-- ACCOUNT BALANCE -->
  <section class="account-balance" aria-label="Account balance">
    <p class="balance-label">Account balance</p>

    <div class="balance-row">
      <span class="balance-amount">£0.00</span>

      <button class="add-funds-button" id="addFundsButton" type="button">
        Add funds
      </button>
    </div>
  </section>

  <!-- CURRENT TICKETS / TICKET HISTORY -->
  <nav class="tabs" aria-label="Ticket sections">
    <div class="tabs-inner">
      <button
        class="tab active"
        id="currentTab"
        type="button"
        aria-selected="true"
      >
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 5.5h16v13H4z"/>
            <path d="M4 9.5a2.5 2.5 0 0 0 0 5"/>
            <path d="M20 9.5a2.5 2.5 0 0 0 0 5"/>
          </svg>
        </span>
        <span>Current tickets</span>
      </button>

      <button
        class="tab"
        id="historyTab"
        type="button"
        aria-selected="false"
      >
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3.5 2"/>
          </svg>
        </span>
        <span>Ticket history</span>
      </button>
    </div>
  </nav>

  <!-- TICKET CARD -->
  <main class="ticket-panel" id="ticketPanel">
    <a class="ticket-card" href="index.html">
      <div class="ticket-heading">
        <div>
          <h2>nBus - 1618 - Direct Issue</h2>
          <p>Unlimited travel · West Midlands nBus zone</p>
        </div>

        <span class="active-status">
          <span class="status-dot"></span>
          Active
        </span>
      </div>

      <div class="ticket-divider"></div>

      <div class="expiry-row">
        <svg class="clock-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>

        <span class="expiry-label">Expires on</span>
        <span class="expiry-date" id="expiryDate">25 October 2026</span>
      </div>
    </a>
  </main>

  <!-- CURRENT TICKETS CONTENT -->
  <section id="currentTickets">
    <button class="refresh-wallet" id="refreshWallet" type="button">
      <span class="refresh-question">Not seeing your latest ticket?</span>
      <span class="refresh-action">Refresh wallet</span>
    </button>
  </section>

  <!-- TICKET HISTORY CONTENT -->
  <section id="ticketHistory" hidden>
    <p class="description">No tickets in your history.</p>
  </section>

  <div class="buy-button" id="buyButton">Buy a new ticket</div>

  <!-- BOTTOM NAVIGATION -->
  <footer class="bottom-nav">
    <div class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M3 7.5h17a1 1 0 0 1 1 1v11H3z"/>
          <path d="M3 7.5V5.8A1.8 1.8 0 0 1 4.8 4H19"/>
          <path d="M3 10.5h18"/>
          <path d="M15.5 14.5h3"/>
        </svg>
      </span>
      <span>Wallet</span>
    </div>

    <div class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>
      </span>
      <span>Notifications</span>
    </div>

    <div class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M13.5 2 5.5 13h6l-1 9 8-12h-6z"/>
        </svg>
      </span>
      <span>Tools</span>
    </div>
  </footer>

  <script>
    // Demo-only weekly expiry display.
    // This does not renew or activate a real ticket.

    function getNextSundayExpiry() {
      const now = new Date();

      const expiry = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      let daysUntilSunday = (7 - expiry.getDay()) % 7;

      if (daysUntilSunday === 0) {
        daysUntilSunday = 7;
      }

      expiry.setDate(expiry.getDate() + daysUntilSunday);
      expiry.setHours(23, 59, 59, 999);

      return expiry;
    }

    function updateExpiryDate() {
      const expiry = getNextSundayExpiry();

      document.getElementById("expiryDate").textContent =
        new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(expiry);
    }

    updateExpiryDate();
    setInterval(updateExpiryDate, 60000);

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        updateExpiryDate();
      }
    });

    // Switch tabs.
    const currentTab = document.getElementById("currentTab");
    const historyTab = document.getElementById("historyTab");
    const currentTickets = document.getElementById("currentTickets");
    const ticketHistory = document.getElementById("ticketHistory");
    const ticketPanel = document.getElementById("ticketPanel");

    currentTab.addEventListener("click", function () {
      currentTab.classList.add("active");
      historyTab.classList.remove("active");

      currentTab.setAttribute("aria-selected", "true");
      historyTab.setAttribute("aria-selected", "false");

      ticketPanel.hidden = false;
      currentTickets.hidden = false;
      ticketHistory.hidden = true;
    });

    historyTab.addEventListener("click", function () {
      historyTab.classList.add("active");
      currentTab.classList.remove("active");

      historyTab.setAttribute("aria-selected", "true");
      currentTab.setAttribute("aria-selected", "false");

      ticketPanel.hidden = true;
      currentTickets.hidden = true;
      ticketHistory.hidden = false;
    });

    // Demo refresh interaction.
    document.getElementById("refreshWallet").addEventListener("click", function () {
      updateExpiryDate();

      const action = this.querySelector(".refresh-action");
      const originalText = action.textContent;

      action.textContent = "Wallet refreshed";

      setTimeout(function () {
        action.textContent = originalText;
      }, 1400);
    });

    // Demo Add funds interaction.
    // No payment processing is connected.
    document.getElementById("addFundsButton").addEventListener("click", function () {
      // Intentionally left inactive until a demo action is chosen.
    });

    // Secret message interaction.
    document.getElementById("buyButton").addEventListener("click", function () {
      // Prevent duplicate popups.
      if (document.getElementById("mustiSecretOverlay")) return;

      const popup = document.createElement("div");
      popup.id = "mustiSecretOverlay";

      popup.style.cssText = `
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        box-sizing: border-box;
        padding: 43vh 24px 24px;
        background: rgba(0, 0, 0, 0.4);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        animation: mustiOverlayFade 0.2s ease;
      `;

      popup.innerHTML = `
        <div style="
          box-sizing: border-box;
          width: 100%;
          max-width: 270px;
          padding: 17px 14px;
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 13px;
          background: rgba(41, 41, 45, 0.78);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          color: #F5F5F5;
          text-align: center;
          box-shadow: 0 8px 30px rgba(0,0,0,0.25);
          animation: mustiPopupIn 0.25s ease;
        ">
          <h3 style="
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.5px;
            color: #969AA2;
          ">✦ SECRET MESSAGE 🕵️ ✦</h3>

          <p style="
            margin: 0 0 8px;
            font-size: 13px;
            line-height: 1.4;
            color: #F5F5F5;
          ">Not everyone discovers this</p>

          <p style="
            margin: 0 0 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #CFCFD4;
          ">But you just couldn't resist clicking, could ya</p>

          <p style="
            margin: 0 0 12px;
            font-size: 13px;
            line-height: 1.4;
            color: #F5F5F5;
          ">Anyways… enjoying mustiBus so far? 👀</p>

          <p style="
            margin: 0 0 13px;
            font-size: 12px;
            font-weight: 600;
            color: #969AA2;
          ">@mvsti0 🦇</p>

          <button id="closeMustiPopup" type="button" style="
            padding: 7px 22px;
            border: none;
            border-radius: 20px;
            background: #777B83;
            color: #29292D;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
          ">Close</button>
        </div>
      `;

      // Add a subtle entrance animation.
      if (!document.getElementById("mustiPopupAnimations")) {
        const style = document.createElement("style");
        style.id = "mustiPopupAnimations";
        style.textContent = `
          @keyframes mustiOverlayFade {
            from { opacity: 0; }
            to { opacity: 1; }
          }

          @keyframes mustiPopupIn {
            from {
              opacity: 0;
              transform: translateY(7px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }
        `;
        document.head.appendChild(style);
      }

      document.body.appendChild(popup);

      // Close button.
      popup.querySelector("#closeMustiPopup").addEventListener("click", function () {
        popup.remove();
      });

      // Close when tapping outside the message.
      popup.addEventListener("click", function (event) {
        if (event.target === popup) {
          popup.remove();
        }
      });

      // Close with Escape on a keyboard.
      function handleEscape(event) {
        if (event.key === "Escape") {
          popup.remove();
          document.removeEventListener("keydown", handleEscape);
        }
      }

      document.addEventListener("keydown", handleEscape);
    });
    document.getElementById("addFundsButton").addEventListener("click", function () {
  window.alert("Nice try pal ✌🏻\nYou've got no funds 😭");
});
  </script>
</body>
</html>
