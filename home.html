<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>mTickets - Wallet</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    html {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: #eef5ff;
    }
    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: 8px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #363636;
      background: #eef5ff;
    }
    .header {
      height: 14vh;
      min-height: 95px;
      max-height: 145px;
      flex-shrink: 0;
      padding: 0 26px 22px;
      display: flex;
      align-items: flex-end;
      position: relative;
      color: white;
      background: linear-gradient(
        135deg,
        #ed0030 0%,
        #ed0030 52%,
        #55585c 52%,
        #55585c 100%
      );
    }
    .header h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 800;
      line-height: 1;
    }
    .profile {
      position: absolute;
      right: 16px;
      bottom: 22px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: white;
      color: #363636;
    }
    .profile svg {
      width: 28px;
      height: 28px;
      display: block;
    }
    .tabs {
      flex-shrink: 0;
      height: 10vh;
      min-height: 65px;
      max-height: 90px;
      display: flex;
      align-items: flex-end;
      margin: 0 22px;
      border-bottom: 1px solid #363636;
    }
    .tab {
      flex: 1;
      min-width: 0;
      position: relative;
      text-align: center;
      padding: 12px 2px 14px;
      font-size: clamp(12px, 3.7vw, 17px);
      font-weight: 750;
      white-space: nowrap;
    }
    .tab.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #000;
    }
    .tab-icon {
      width: 24px;
      height: 24px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 5px;
    }
    .tab-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ticket-panel {
      flex: 1 1 0;
      min-height: 180px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin: 8px 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: white;
      border-radius: 18px;
    }
    .ticket-card {
      display: block;
      flex-shrink: 0;
      padding: 14px;
      color: inherit;
      text-decoration: none;
      text-align: left;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.12);
      transition: background-color 0.12s ease;
    }
    .ticket-card:active {
      background: #e8e8e8;
    }
    .ticket-card h2 {
      margin: 0 0 7px;
      font-size: clamp(16px, 4.5vw, 19px);
      font-weight: 750;
    }
    .ticket-card p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.35;
    }
    .ticket-preview {
      display: flex;
      height: 38px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 6px;
    }
    .ticket-preview span {
      flex: 1;
    }
    .description {
      flex-shrink: 0;
      margin: 14px 0 0;
      color: #7c7f84;
      font-size: clamp(14px, 4vw, 19px);
      line-height: 1.35;
    }
    .buy-button {
      flex-shrink: 0;
      margin: 0 16px 8px;
      padding: 13px 6px;
      border-radius: 50px;
      background: #ed0030;
      color: white;
      text-align: center;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 750;
    }
    .bottom-nav {
      flex-shrink: 0;
      min-height: 68px;
      padding: 6px 4px max(6px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: white;
      border-top: 1px solid #d8dfe8;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px;
      font-weight: 650;
      font-size: 12px;
    }
    .nav-icon {
      width: 27px;
      height: 27px;
      display: block;
    }
    .nav-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (max-height: 700px) {
      .header {
        min-height: 85px;
        padding-bottom: 15px;
      }
      .profile {
        bottom: 16px;
        width: 42px;
        height: 42px;
      }
      .tabs {
        min-height: 55px;
      }
      .ticket-panel {
        margin-top: 6px;
        margin-bottom: 6px;
        padding: 8px;
      }
      .ticket-card {
        padding: 10px;
      }
      .ticket-preview {
        height: 30px;
        margin-top: 8px;
      }
      .description {
        margin-top: 9px;
      }
      .buy-button {
        margin-bottom: 6px;
        padding: 10px 6px;
      }
      .bottom-nav {
        min-height: 60px;
      }
      .nav-icon {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>mTickets</h1>
    <div class="profile" aria-label="Profile">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="15" r="7"
          stroke="currentColor" stroke-width="3.2" fill="none"/>
        <path d="M7 39 C7 29, 15 27, 24 27 C33 27, 41 29, 41 39"
          stroke="currentColor" stroke-width="3.2"
          stroke-linecap="round" fill="none"/>
      </svg>
    </div>
  </header>
  <nav class="tabs">
    <div class="tab active">
      <span class="tab-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 5.5h16v13H4z"/>
          <path d="M4 9.5a2.5 2.5 0 0 0 0 5"/>
          <path d="M20 9.5a2.5 2.5 0 0 0 0 5"/>
        </svg>
      </span>
      Current tickets
    </div>
    <div class="tab">
      <span class="tab-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3.5 2"/>
        </svg>
      </span>
      Ticket history
    </div>
  </nav>
  <main class="ticket-panel">
    <a class="ticket-card" href="index.html">
      <h2>nBus - 1618 - Direct Issue</h2>
      <p>Unlimited travel · West Midlands nBus zone</p>
      <div class="ticket-preview" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </a>
    <p class="description">Tap your ticket above to view it.</p>
  </main>
  <div class="buy-button">Buy a new ticket</div>
  <footer class="bottom-nav">
    <div class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M3 7.5h17a1 1 0 0 1 1 1v11H3z"/>
          <path d="M3 7.5V5.8A1.8 1.8 0 0 1 4.8 4H19"/>
          <path d="M3 10.5h18"/>
          <path d="M15.5 14.5h3"/>
        </svg>
      </span>
      <span>Wallet</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>
      </span>
      <span>Notifications</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M13.5 2 5.5 13h6l-1 9 8-12h-6z"/>
        </svg>
      </span>
      <span>Tools</span>
    </div>
  </footer>
  <script>
    // Shared coordinated palettes. Keep identical in both HTML files.
    function getSharedHourlyStripColours() {
      const palettes = [
        // Greys: neutral, not nearly black
        ["#626873", "#858D98", "#B0B7C0"],
        ["#747D88", "#A6AFBA", "#D0D5DC"],
        ["#858D98", "#C3C9D1", "#747D88"],
        ["#626873", "#929AA5", "#C3C9D1"],
        // Icy blues
        ["#579CCB", "#82CFFF", "#B6E3F9"],
        ["#77BDE8", "#A9DDF7", "#D7F2FF"],
        ["#397DB5", "#82CFFF", "#D7F2FF"],
        ["#537DA9", "#77BDE8", "#B6E3F9"],
        // Magenta and pink
        ["#A51A78", "#D934A8", "#F052C5"],
        ["#D934A8", "#F052C5", "#FF78D2"],
        ["#A51A78", "#E4A3D1", "#F052C5"],
        ["#C12B91", "#E65DBB", "#F6A6DD"],
        // Purple family
        ["#655078", "#904893", "#C9B4DE"],
        ["#6A426B", "#904893", "#B7A0D4"],
        ["#7C55A0", "#B7A0D4", "#D9C9EA"],
        ["#655078", "#8E6CA5", "#B7A0D4"],
        // Blues
        ["#4056A1", "#397DB5", "#77BDE8"],
        ["#397DB5", "#477DB3", "#A9DDF7"],
        ["#4056A1", "#537DA9", "#82CFFF"],
        ["#477DB3", "#579CCB", "#B6E3F9"],
        // Reds, coral and orange
        ["#D92745", "#E64B55", "#F18A35"],
        ["#D94B75", "#E75D35", "#F2A23A"],
        ["#D92745", "#D94B75", "#F0526B"],
        ["#E64B55", "#F18A35", "#F2A23A"],
        // Greens and teal
        ["#278D83", "#398C79", "#5A9C9B"],
        ["#468C55", "#48A36D", "#6AAE79"],
        ["#278D83", "#5A9C9B", "#82C5BB"],
        ["#398C79", "#48A36D", "#A1CFA5"],
        // Yellow and gold
        ["#C99B36", "#E0A52E", "#F0C879"],
        ["#D9B44A", "#E5D06D", "#F3C542"],
        ["#C99B36", "#E5D06D", "#F0C879"],
        ["#E0A52E", "#F3C542", "#F7D98A"],
        // Mixed but coordinated accent palettes
        ["#626873", "#579CCB", "#82CFFF"],
        ["#655078", "#A51A78", "#E4A3D1"],
        ["#4056A1", "#477DB3", "#D7F2FF"],
        ["#747D88", "#904893", "#C9B4DE"],
        ["#278D83", "#579CCB", "#B6E3F9"],
        ["#A51A78", "#D934A8", "#E4A3D1"],
        ["#626873", "#A6AFBA", "#D7F2FF"],
        ["#6A426B", "#7C55A0", "#D9C9EA"]
      ];
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());
      const getPart = type =>
        parts.find(item => item.type === type).value;
      const year = Number(getPart("year"));
      const month = Number(getPart("month"));
      const day = Number(getPart("day"));
      const hour = Number(getPart("hour"));
      const hourNumber = Math.floor(
        Date.UTC(year, month - 1, day, hour) / 3600000
      );
      // Deterministic palette selection: both pages match each UK hour.
      let seed = hourNumber >>> 0;
      seed = (Math.imul(seed ^ (seed >>> 16), 0x45d9f3b)) >>> 0;
      seed = (Math.imul(seed ^ (seed >>> 16), 0x45d9f3b)) >>> 0;
      seed = (seed ^ (seed >>> 16)) >>> 0;
      return palettes[seed % palettes.length].slice();
    }
    function updateWalletStripColours() {
      const colours = getSharedHourlyStripColours();
      document.querySelectorAll(".ticket-preview span")
        .forEach((strip, index) => {
          strip.style.backgroundColor = colours[index];
        });
    }
    updateWalletStripColours();
    setInterval(updateWalletStripColours, 1000);
    window.addEventListener("pageshow", updateWalletStripColours);
  </script>
</body>
</html>
